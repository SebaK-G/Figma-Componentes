<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Plan Card</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="estilo.css" />
  </head>
  <body>
        <header class="fluenty-header">
    <div class="brand">
        <div class="brand-mark" aria-hidden="true"></div>
        <div class="brand-name">Fluenty</div>
    </div>

    <nav class="nav" aria-label="Navegación principal">
        <a href="#" class="nav-item active">Home</a>
        <a href="#" class="nav-item">Cursos</a>
        <a href="#" class="nav-item">Calculadora</a>
        <a href="#" class="nav-item">Empleados</a>
    </nav>

    <div class="user-area">
        <button class="notification" aria-label="Notificaciones">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path d="M9 18H15M7 9C7 7.67392 7.52678 6.40215 8.46447 5.46447C9.40215 4.52678 10.6739 4 12 4C13.3261 4 14.5979 4.52678 15.5355 5.46447C16.4732 6.40215 17 7.67392 17 9V12L18.5 16H5.5L7 12V9Z" />
            <path d="M10 18C10.5 19 11.2 19.5 12 19.5C12.8 19.5 13.5 19 14 18" />
        </svg>
        </button>

        <div class="user-meta">
        <span class="user-name">Matías Tarsi</span>
        <div class="avatar" aria-label="Avatar del usuario"></div>
        </div>
    </div>
    </header>
    <div class="card">
      <div class="card-header">
        <div class="plan-label">
          <span class="check-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <circle cx="12" cy="12" r="9.5" />
              <path d="M7 12.5L10.2 15.7L17 8.9" />
            </svg>
          </span>
          <span>Tu plan</span>
        </div>

        <a href="#" class="see-all">
          Ver todas
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M5 12H19M19 12L13 6M19 12L13 18" />
          </svg>
        </a>
      </div>

      <h2>Plan Empresarial Activo</h2>

      <p class="description">
        Contás con el plan empresarial financiado por 3 meses más, con acceso
        simultáneo para 23 empleados activos.
      </p>

      <div class="usage-row">
        <span>Cupos utilizados: 23/30</span>
        <span>76%</span>
      </div>

      <div class="progress-bar" aria-label="Progreso de cupos">
        <div class="progress-fill"></div>
      </div>
    </div>
  </body>
</html>
